    <script>
      // Apply the theme before first paint to avoid a flash (keep in sync with ThemeContext)
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('eber-theme-v3');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (!theme) theme = 'dark';
        var root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#09090b' : '#fafafa';
        root.style.color = theme === 'dark' ? '#f4f4f5' : '#09090b';
      })();
