<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eber · Diseñador Gráfico, Ilustrador & Tipógrafo</title>
    <meta name="description" content="Eber, diseñador gráfico, ilustrador y tipógrafo con más de 10 años creando identidades visuales, conceptos y universos de marca. Dirección de arte para la industria textil, el entretenimiento y los contenidos infantiles." />
    <meta property="og:title" content="Eber · Diseñador Gráfico, Ilustrador & Tipógrafo" />
    <meta property="og:description" content="Identidades visuales, conceptos y universos de marca. Dirección de arte e ilustración." />
    <meta property="og:image" content="https://res.cloudinary.com/le59kgwh/image/upload/f_jpg,q_auto,c_fill,w_1200,h_630,g_face/about_me" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:type" content="website" />
    <script>
      // Apply the theme before first paint to avoid a flash (keep in sync with ThemeContext)
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('eber-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        if (!theme) theme = 'dark';
        var root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#09090b' : '#fafafa';
        root.style.color = theme === 'dark' ? '#f4f4f5' : '#09090b';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
