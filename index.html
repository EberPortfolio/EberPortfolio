<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eber · Diseñador Gráfico & Director de Arte</title>
    <meta name="description" content="Portfolio de Eber: Especialista en identidad visual, packaging de autor, diseño editorial y dirección de arte con estética minimalista." />
    <meta property="og:title" content="Eber · Diseñador Gráfico & Director de Arte" />
    <meta property="og:description" content="Identidad visual, packaging de autor, diseño editorial y dirección de arte." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme before first paint to avoid a dark flash on reload
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('eber-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'ink') theme = stored;
        } catch (e) {}
        var colors = { dark: ['#09090B', '#F4F4F5'], light: ['#FAFAFA', '#09090B'], ink: ['#F2EDE2', '#1A1816'] };
        var root = document.documentElement;
        root.className = theme === 'dark' ? 'dark theme-dark' : 'theme-' + theme;
        root.style.backgroundColor = colors[theme][0];
        root.style.color = colors[theme][1];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
