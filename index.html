    <script>
      // Apply the saved theme before first paint to avoid a dark flash on reload
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('eber-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'ink') theme = stored;
        } catch (e) {}
        var colors = { dark: ['#09090B', '#F4F4F5'], light: ['#FAFAFA', '#09090B'], ink: ['#F2EDE2', '#1A1816'] };
        var root = document.documentElement;
        root.className = theme === 'dark' ? 'dark theme-dark' : 'theme-' + theme;
        root.style.backgroundColor = colors[theme][0];
        root.style.color = colors[theme][1];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
